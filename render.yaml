# Render Blueprint: one web service for the website + API, with a persistent disk for the
# SQLite database and uploaded documents. See DEPLOY.md for the step-by-step guide.
services:
  - type: web
    name: cab-system
    runtime: node
    # A persistent disk needs a paid instance type (free instances lose files on restart).
    plan: starter
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: cab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
      # Set to your site's address, e.g. https://cab-system.onrender.com or https://cabs.example.com
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Used when building the website. The same service serves the API, so the URL is relative.
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
